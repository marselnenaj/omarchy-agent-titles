name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Model and settings tests
        run: node --test tests/*.test.cjs
      - name: Validate package and publication contents
        run: python3 scripts/check-publication.py
      - name: Shell syntax and ShellCheck
        run: |
          bash -n install.sh scripts/scan-secrets.sh
          shellcheck install.sh scripts/scan-secrets.sh
      - name: Scan git history for secrets
        run: bash scripts/scan-secrets.sh
